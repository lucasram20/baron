name: CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      live_opgg:
        description: Run one live OP.GG tier-list check
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  check-and-test:
    name: Frontend & Rust CI (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint frontend (VoidZero oxlint)
        working-directory: frontend
        run: bun run lint

      - name: Test provider availability
        working-directory: frontend
        run: bun test tests/provider-availability.test.js

      - name: Typecheck frontend (TypeScript)
        working-directory: frontend
        run: bun run typecheck

      - name: Build frontend static export (Next.js)
        working-directory: frontend
        run: bun run build

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check all workspace targets
        run: cargo check --workspace --bins

      - name: Run workspace test suite
        run: cargo test --workspace --verbose

      - name: Check live OP.GG MCP tier list
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_opgg }}
        run: cargo test -p baron-riot --test provider_payloads live_opgg_tier_list -- --ignored --exact
