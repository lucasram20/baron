name: Stable Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build-stable-release:
    name: Build Stable Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: baron-windows-x86_64.zip
            bin_path: target/release/baron-app.exe
          - os: macos-latest
            artifact_name: baron-macos-universal.tar.gz
            bin_path: target/release/baron-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint & typecheck frontend
        working-directory: frontend
        run: |
          bun run lint
          bun run typecheck

      - name: Build frontend static export (Next.js)
        working-directory: frontend
        run: bun run build

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build Baron release binary
        run: cargo build --release -p baron-app --features custom-protocol

      - name: Resolve stable tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package Windows release NSIS installer & zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $installer = "Baron-Setup-$tag-x86_64.exe"
          $zipName = "${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.bin_path }}" dist/Baron.exe
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "$zipName" -Force
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              $env:PATH += ";C:\Program Files (x86)\NSIS"
            } else {
              choco install nsis -y --no-progress
              $env:PATH += ";C:\Program Files (x86)\NSIS"
            }
          }
          $outExe = Join-Path (Get-Location).Path $installer
          makensis "/DVERSION=$tag" "/DOUTFILE=$outExe" installer/baron.nsi
          foreach ($f in @($installer, $zipName)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii "$f.sha256"
          }

      - name: Package macOS release artifact
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" dist/baron
          cp README.md LICENSE dist/
          tar -czf "${{ matrix.artifact_name }}" -C dist .
          shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: baron-release-${{ matrix.os }}
          path: |
            Baron-Setup-*.exe
            Baron-Setup-*.exe.sha256
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          if-no-files-found: ignore

  publish-stable-release:
    name: Publish Official Stable Release
    needs: build-stable-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Official Stable Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-stable-release.outputs.tag }}
          name: "Baron ${{ needs.build-stable-release.outputs.tag }}"
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
