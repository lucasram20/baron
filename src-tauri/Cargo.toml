[package]
name = "baron-app"
version.workspace = true
edition.workspace = true
description = "Baron — Native Tauri v2 desktop host for the League of Legends companion & analytics app"

[[bin]]
name = "baron-app"
path = "src/main.rs"

[lib]
name = "baron_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
baron-core = { path = "../crates/baron-core" }
baron-db = { path = "../crates/baron-db" }
baron-lcu = { path = "../crates/baron-lcu" }
baron-riot = { path = "../crates/baron-riot" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
