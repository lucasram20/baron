[workspace]
resolver = "2"
members = [
    "crates/baron-core",
    "crates/baron-db",
    "crates/baron-lcu",
    "crates/baron-riot",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Baron Contributors"]

[workspace.dependencies]
baron-core = { path = "crates/baron-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
